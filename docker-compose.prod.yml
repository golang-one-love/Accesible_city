# =============================================================================
# Accessible Path - Production stack (standalone)
#
# Designed for Beget VPS (1 CPU / 2 GB RAM) with MANAGED PostgreSQL and S3:
#   - postgres and minio containers are NOT started (external managed services)
#   - redis runs locally (event bus + WebSocket presence)
#   - only nginx publishes ports (80/443); services are internal
#   - builds images from source (no registry required)
#
# Usage:
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
# =============================================================================

name: accessible-path-prod

services:
  # ==========================================
  # Local infrastructure
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: accessible-path-prod-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - accessible-path-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # ==========================================
  # Backend services
  # ==========================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: accessible-path-prod-auth
    environment:
      - PORT=${AUTH_SERVICE_PORT:-8081}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${AUTH_DB_USER}
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD}
      - POSTGRES_DB=${AUTH_DB_NAME}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      - JWT_PRIVATE_KEY_PATH=/keys/private.pem
      - JWT_PUBLIC_KEY_PATH=/keys/public.pem
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-168h}
      - BCRYPT_COST=${BCRYPT_COST:-12}
      - SEED_MODERATOR_EMAIL=${SEED_MODERATOR_EMAIL:-moderator@accessible.city}
      - SEED_MODERATOR_PASSWORD=${SEED_MODERATOR_PASSWORD:-}
    volumes:
      - ./services/auth-service/keys:/keys:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - accessible-path-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  barrier-service:
    build:
      context: ./services/barrier-service
      dockerfile: Dockerfile
    container_name: accessible-path-prod-barrier
    environment:
      - PORT=${BARRIER_SERVICE_PORT:-8000}
      - HOST=${BARRIER_SERVICE_HOST:-0.0.0.0}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${BARRIER_DB_USER}
      - POSTGRES_PASSWORD=${BARRIER_DB_PASSWORD}
      - POSTGRES_DB=${BARRIER_DB_NAME}
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE:-disable}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-barrier-photos}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ADDRESSING_STYLE=${S3_ADDRESSING_STYLE:-path}
      - STREAM_BARRIER_CREATED=${STREAM_BARRIER_CREATED:-barrier.created}
      - JWT_PUBLIC_KEY_PATH=/keys/public.pem
    volumes:
      - ./services/auth-service/keys:/keys:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - accessible-path-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  moderation-service:
    build:
      context: ./services/moderation-service
      dockerfile: Dockerfile
    container_name: accessible-path-prod-moderation
    environment:
      - PORT=${MODERATION_SERVICE_PORT:-8001}
      - HOST=${MODERATION_SERVICE_HOST:-0.0.0.0}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${MODERATION_DB_USER}
      - POSTGRES_PASSWORD=${MODERATION_DB_PASSWORD}
      - POSTGRES_DB=${MODERATION_DB_NAME}
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE:-disable}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STREAM_BARRIER_CREATED=${STREAM_BARRIER_CREATED:-barrier.created}
      - STREAM_BARRIER_APPROVED=${STREAM_BARRIER_APPROVED:-barrier.approved}
      - STREAM_BARRIER_REJECTED=${STREAM_BARRIER_REJECTED:-barrier.rejected}
      - CONSUMER_GROUP_MODERATION=${CONSUMER_GROUP_MODERATION:-moderation-group}
      - JWT_PUBLIC_KEY_PATH=/keys/public.pem
    volumes:
      - ./services/auth-service/keys:/keys:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - accessible-path-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  route-service:
    build:
      context: ./services/route-service
      dockerfile: Dockerfile
    container_name: accessible-path-prod-route
    environment:
      - PORT=${ROUTE_SERVICE_PORT:-8082}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${ROUTE_DB_USER}
      - POSTGRES_PASSWORD=${ROUTE_DB_PASSWORD}
      - POSTGRES_DB=${ROUTE_DB_NAME}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      - BARRIER_SERVICE_URL=http://barrier-service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OSM_OVERPASS_URL=${OSM_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      - OSM_DEFAULT_BBOX=${OSM_DEFAULT_BBOX:-55.7000,37.5200,55.8000,37.7200}
      - JWT_PUBLIC_KEY_PATH=/keys/public.pem
    volumes:
      - ./services/auth-service/keys:/keys:ro
    depends_on:
      redis:
        condition: service_healthy
      barrier-service:
        condition: service_healthy
    healthcheck:
      # generous: first start imports the OSM graph (can take several minutes)
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 40
    networks:
      - accessible-path-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  poi-service:
    build:
      context: ./services/poi-service
      dockerfile: Dockerfile
    container_name: accessible-path-prod-poi
    environment:
      - PORT=${POI_SERVICE_PORT:-8002}
      - HOST=${POI_SERVICE_HOST:-0.0.0.0}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POI_DB_USER}
      - POSTGRES_PASSWORD=${POI_DB_PASSWORD}
      - POSTGRES_DB=${POI_DB_NAME}
      - POSTGRES_SSL_MODE=${POSTGRES_SSL_MODE:-disable}
      - JWT_PUBLIC_KEY_PATH=/keys/public.pem
    volumes:
      - ./services/auth-service/keys:/keys:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - accessible-path-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: accessible-path-prod-notification
    environment:
      - PORT=${NOTIFICATION_SERVICE_PORT:-8083}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${NOTIFICATION_DB_USER}
      - POSTGRES_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - POSTGRES_DB=${NOTIFICATION_DB_NAME}
      - POSTGRES_SSLMODE=${POSTGRES_SSLMODE:-disable}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STREAM_BARRIER_APPROVED=${STREAM_BARRIER_APPROVED:-barrier.approved}
      - STREAM_BARRIER_RESOLVED=${STREAM_BARRIER_RESOLVED:-barrier.resolved}
      - CONSUMER_GROUP_NOTIFICATION=${CONSUMER_GROUP_NOTIFICATION:-notification-group}
      - JWT_PUBLIC_KEY_PATH=/keys/public.pem
    volumes:
      - ./services/auth-service/keys:/keys:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - accessible-path-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ==========================================
  # Frontend (static SPA + local proxy to nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accessible-path-prod-frontend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - accessible-path-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.05'

  # ==========================================
  # Reverse proxy (the only public entry point)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: accessible-path-prod-nginx
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - ./infra/nginx/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      auth-service:
        condition: service_healthy
      barrier-service:
        condition: service_healthy
      moderation-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
      poi-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - accessible-path-prod
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.05'

# ==========================================
# Volumes
# ==========================================
volumes:
  redisdata:

# ==========================================
# Networks
# ==========================================
networks:
  accessible-path-prod:
    driver: bridge
