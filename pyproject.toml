[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001", "DTZ003"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.adapters.out.persistence.models"
disable_error_code = ["misc", "valid-type"]
