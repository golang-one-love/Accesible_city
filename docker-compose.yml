services:
  # ==========================================
  # Infrastructure
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: accessible-path-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - accessible-path-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: accessible-path-redis
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - accessible-path-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: accessible-path-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - accessible-path-network
    restart: unless-stopped

  # ==========================================
  # Backend Services
  # ==========================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: accessible-path-auth
    environment:
      - PORT=${AUTH_SERVICE_PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${AUTH_DB_USER}
      - POSTGRES_PASSWORD=${AUTH_DB_PASSWORD}
      - POSTGRES_DB=${AUTH_DB_NAME}
      - JWT_PRIVATE_KEY_PATH=/keys/private.pem
      - JWT_PUBLIC_KEY_PATH=/keys/public.pem
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL}
      - BCRYPT_COST=${BCRYPT_COST}
    volumes:
      - ./services/auth-service/keys:/keys:ro
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - accessible-path-network
    restart: unless-stopped

  barrier-service:
    build:
      context: ./services/barrier-service
      dockerfile: Dockerfile
    container_name: accessible-path-barrier
    environment:
      - PORT=${BARRIER_SERVICE_PORT}
      - HOST=${BARRIER_SERVICE_HOST}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${BARRIER_DB_USER}
      - POSTGRES_PASSWORD=${BARRIER_DB_PASSWORD}
      - POSTGRES_DB=${BARRIER_DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET}
      - MINIO_USE_SSL=${MINIO_USE_SSL}
      - STREAM_BARRIER_CREATED=${STREAM_BARRIER_CREATED}
      - JWT_PUBLIC_KEY_PATH=/keys/public.pem
    volumes:
      - ./services/auth-service/keys:/keys:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - accessible-path-network
    restart: unless-stopped

  moderation-service:
    build:
      context: ./services/moderation-service
      dockerfile: Dockerfile
    container_name: accessible-path-moderation
    environment:
      - PORT=${MODERATION_SERVICE_PORT}
      - HOST=${MODERATION_SERVICE_HOST}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${MODERATION_DB_USER}
      - POSTGRES_PASSWORD=${MODERATION_DB_PASSWORD}
      - POSTGRES_DB=${MODERATION_DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STREAM_BARRIER_CREATED=${STREAM_BARRIER_CREATED}
      - STREAM_BARRIER_APPROVED=${STREAM_BARRIER_APPROVED}
      - STREAM_BARRIER_REJECTED=${STREAM_BARRIER_REJECTED}
      - CONSUMER_GROUP_MODERATION=${CONSUMER_GROUP_MODERATION}
      - JWT_PUBLIC_KEY_PATH=/keys/public.pem
    volumes:
      - ./services/auth-service/keys:/keys:ro
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - accessible-path-network
    restart: unless-stopped

  route-service:
    build:
      context: ./services/route-service
      dockerfile: Dockerfile
    container_name: accessible-path-route
    environment:
      - PORT=${ROUTE_SERVICE_PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${ROUTE_DB_USER}
      - POSTGRES_PASSWORD=${ROUTE_DB_PASSWORD}
      - POSTGRES_DB=${ROUTE_DB_NAME}
      - BARRIER_SERVICE_URL=http://barrier-service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      barrier-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - accessible-path-network
    restart: unless-stopped

  poi-service:
    build:
      context: ./services/poi-service
      dockerfile: Dockerfile
    container_name: accessible-path-poi
    environment:
      - PORT=${POI_SERVICE_PORT}
      - HOST=${POI_SERVICE_HOST}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POI_DB_USER}
      - POSTGRES_PASSWORD=${POI_DB_PASSWORD}
      - POSTGRES_DB=${POI_DB_NAME}
      - JWT_PUBLIC_KEY_PATH=/keys/public.pem
    volumes:
      - ./services/auth-service/keys:/keys:ro
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - accessible-path-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: accessible-path-notification
    environment:
      - PORT=${NOTIFICATION_SERVICE_PORT}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${NOTIFICATION_DB_USER}
      - POSTGRES_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - POSTGRES_DB=${NOTIFICATION_DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - STREAM_BARRIER_APPROVED=${STREAM_BARRIER_APPROVED}
      - STREAM_BARRIER_RESOLVED=${STREAM_BARRIER_RESOLVED}
      - CONSUMER_GROUP_NOTIFICATION=${CONSUMER_GROUP_NOTIFICATION}
      - JWT_PUBLIC_KEY_PATH=/keys/public.pem
    volumes:
      - ./services/auth-service/keys:/keys:ro
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - accessible-path-network
    restart: unless-stopped

  # ==========================================
  # Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accessible-path-frontend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    ports:
      - "3000:80"
    depends_on:
      - nginx
    networks:
      - accessible-path-network
    restart: unless-stopped

  # ==========================================
  # Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: accessible-path-nginx
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      auth-service:
        condition: service_healthy
      barrier-service:
        condition: service_healthy
      moderation-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
      poi-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - accessible-path-network
    restart: unless-stopped

# ==========================================
# Volumes
# ==========================================
volumes:
  pgdata:
  redisdata:
  miniodata:

# ==========================================
# Networks
# ==========================================
networks:
  accessible-path-network:
    driver: bridge